name: Build EXE
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build desktop jar
        run: ./gradlew :desktop:jar --no-daemon
        shell: bash
      - name: Prepare
        run: |
          mkdir -p dist
          cp desktop/build/libs/desktop.jar dist/MiniMilitary3D.jar
          cp -r app/src/main/assets dist/assets
        shell: bash
      - name: Create EXE
        run: jpackage --type exe --input dist --main-jar MiniMilitary3D.jar --main-class com.minimilitary3d.DesktopLauncher --name "MiniMilitary3D" --app-version 0.2 --win-shortcut --win-menu --win-dir-chooser --dest dist-final
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: MiniMilitary3D-installer
          path: dist-final/*.exe
          retention-days: 30
